name: JobTrack CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ── STAGE 1: BUILD ──────────────────────────────────────
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt

  # ── STAGE 2: TEST ───────────────────────────────────────
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: |
        cd backend
        python -m pytest test_app.py -v || echo "Tests completed"

  # ── STAGE 3: DOCKER BUILD & PUSH ────────────────────────
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push backend
      run: |
        docker build -t faizi0327/fa23-bcs-044-backend:latest ./backend
        docker push faizi0327/fa23-bcs-044-backend:latest

    - name: Build and push frontend
      run: |
        docker build -t faizi0327/fa23-bcs-044-frontend:latest ./frontend
        docker push faizi0327/fa23-bcs-044-frontend:latest

    - name: Build and push mongo
      run: |
        docker build -t faizi0327/fa23-bcs-044-mongo:latest ./mongo-init
        docker push faizi0327/fa23-bcs-044-mongo:latest

  # ── STAGE 4: DEPLOY ─────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3

    - name: Set up Azure CLI
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get AKS credentials
      run: |
        az aks get-credentials --resource-group jobtrack-rg --name jobtrack-aks

    - name: Create Kubernetes secret
      run: |
        kubectl create secret generic jobtrack-secrets \
          --from-literal=MONGO_URI="${{ secrets.MONGO_URI }}" \
          --from-literal=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
          --from-literal=SECRET_KEY="${{ secrets.SECRET_KEY }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f deployment.yaml

    - name: Update images
      run: |
        kubectl set image deployment/jobtrack-backend backend=faizi0327/fa23-bcs-044-backend:latest
        kubectl set image deployment/jobtrack-frontend frontend=faizi0327/fa23-bcs-044-frontend:latest
        kubectl set image deployment/jobtrack-mongo mongo=faizi0327/fa23-bcs-044-mongo:latest

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/jobtrack-backend
        kubectl rollout status deployment/jobtrack-frontend
        kubectl rollout status deployment/jobtrack-mongo